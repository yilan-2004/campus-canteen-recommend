spring:
  datasource:
    url: jdbc:h2:mem:shitang;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  sql:
    init:
      mode: always
      schema-locations: classpath:db-smoke-schema.sql
      data-locations: classpath:db-smoke-data.sql
      continue-on-error: false

server:
  port: 18080

logging:
  level:
    com.example.shitang: INFO
    org.springframework.security: WARN

# 关闭缓存和 A/B,方便 smoke test
recommend:
  cache:
    enabled: false
  ab-test:
    enabled: false
