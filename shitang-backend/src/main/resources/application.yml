server:
  port: 8080

spring:
  application:
    name: shitang-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shitang_recommend?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  # 生产环境请改为更长、更随机的密钥，并通过环境变量注入
  secret: shitang-graduation-project-jwt-secret-please-change-in-production-2026
  expire-minutes: 1440

# 第五阶段: Knife4j / OpenAPI 文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
    swagger-model-name: 实体类列表
  basic:
    enable: false

# 第五阶段: Redis 缓存
spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DB:0}
  timeout: 2s
  lettuce:
    pool:
      max-active: 16
      max-idle: 8
      min-idle: 2
      max-wait: 1s

# CORS 配置(逗号分隔多个域名, * 表示允许所有)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# 推荐系统配置
recommend:
  cache:
    enabled: ${RECOMMEND_CACHE_ENABLED:true}
    hot-ttl-seconds: 300         # 热门 5min
    high-score-ttl-seconds: 600  # 高分 10min
    scenario-ttl-seconds: 600    # 场景 10min
    personalized-ttl-seconds: 180 # 个性化 3min
  ab-test:
    enabled: ${AB_TEST_ENABLED:false}
    strategy-a-weight: 50         # 策略 A(基础混合) 权重
    strategy-b-weight: 50         # 策略 B(强内容弱协同) 权重
